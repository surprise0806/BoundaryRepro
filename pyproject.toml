[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "boundary-repro"
version = "0.6.0"
description = "Stateful and resumable repository issue repair agent"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {text = "MIT"}
authors = [
  {name = "Yan Tian"}
]
dependencies = [
  "aiosqlite>=0.22,<1",
  "groq>=1.6,<2",
  "langgraph>=1.2.9,<1.3",
  "langgraph-checkpoint-sqlite>=3.1,<4",
  "pydantic>=2.12,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]

[project.scripts]
boundary-repair = "boundary_repro.repair.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
